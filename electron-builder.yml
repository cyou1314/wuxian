appId: com.cyou.xan
productName: Xan
asar: true
afterPack: scripts/verify-desktop-package.cjs
directories:
  app: desktop
  output: release
files:
  - main.cjs
  - preload.cjs
  - project.cjs
  - accounts.cjs
  - media.cjs
  - web-generation.cjs
  - package.json
  - '!node_modules/**/*'
extraResources:
  - from: desktop/bin
    to: media
  - from: .next/standalone
    to: web
    filter:
      - '**/*'
      - '!**/.data/**'
      - '!**/.env*'
      - '!**/cache/**'
  # Root node_modules needs its own mapping; the default copier skips it.
  - from: .next/standalone/node_modules
    to: web/node_modules
    filter:
      - '**/*'
      - '!**/.env*'
      - '!**/cache/**'
win:
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
mac:
  icon: desktop/icon.icns
  category: public.app-category.graphics-design
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
  hardenedRuntime: true
  entitlements: desktop/entitlements.mac.plist
  entitlementsInherit: desktop/entitlements.mac.plist
artifactName: Xan-${version}-${os}-${arch}.${ext}
